<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jump – varianta B</title>
<style>
body{margin:0;background:#06061a;color:#aaf;font:12px 'Courier New',monospace;padding:10px;text-align:center}
#g{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;max-width:440px;margin:10px auto}
canvas{width:100%;height:auto;border:1px solid #3a3aff;background:#0d0d2a}
button{font:inherit;background:#0d0d2a;color:#aaf;border:1px solid #3a3aff;padding:6px 14px}
button:focus-visible{outline:2px solid #fff}
</style></head><body>
<button id="slow">Zpomalit ×4</button> <button id="mode">Oblouk: brouk</button>
<div id="g"></div>
<script>
const {PI, sin, cos, random, min, max} = Math, DUR = 600, LOOP = 2600, R = 38, S = 200;
const cvs = [0, 45, 90, 135, 180, 225, 270, 315].map(d => {
  const cv = document.createElement("canvas"); cv.width = cv.height = S; cv.a = d * PI / 180;
  return document.getElementById("g").appendChild(cv);
});
let mode = 0, slow = 1, t0 = performance.now(), spin = PI, last = LOOP;
document.getElementById("mode").onclick = e => (mode ^= 1, e.target.textContent = mode ? "Oblouk: stín" : "Oblouk: brouk");
document.getElementById("slow").onclick = e => (slow = slow === 1 ? 4 : 1, e.target.textContent = slow === 1 ? "Zpomalit ×4" : "Normální rychlost");
function bug(c, x, y, dir, s, hue) {
  c.save(); c.translate(x, y); c.rotate(dir); c.scale(s, s);
  c.strokeStyle = `hsl(${hue},40%,35%)`; c.lineWidth = 1.2;
  [-1, 1].forEach(k => [-4, 0, 4].forEach(lx => (c.beginPath(), c.moveTo(lx, 0), c.lineTo(lx + 2, k * 9), c.stroke())));
  c.beginPath(); c.moveTo(9, -2); c.lineTo(14, -6); c.moveTo(9, 2); c.lineTo(14, 6); c.stroke();
  c.fillStyle = `hsl(${hue},70%,50%)`;
  c.beginPath(); c.ellipse(-6, 0, 8, 5.5, 0, 0, 2 * PI); c.fill();
  c.beginPath(); c.ellipse(3, 0, 3.5, 4, 0, 0, 2 * PI); c.fill();
  c.fillStyle = `hsl(${hue},70%,35%)`; c.beginPath(); c.arc(8, 0, 2.8, 0, 2 * PI); c.fill();
  c.restore();
}
function frame(now) {
  const ms = ((now - t0) / slow) % LOOP;
  ms < last && (spin = PI * (150 + random() * 60) / 180); last = ms;
  const k = min(1, max(0, (ms - 800) / DUR)), h = sin(PI * k), u = -R + 2 * R * k, td = ms > 1400 ? PI * min(1, (ms - 1400) / 1000) : 0;
  cvs.forEach(cv => {
    const c = cv.getContext("2d"), a = cv.a, ca = cos(a), sa = sin(a), m = S / 2, x = m + ca * u, y = m + sa * u;
    c.clearRect(0, 0, S, S);
    bug(c, m, m, a + PI + td, 1, 30);
    c.fillStyle = "rgba(0,0,0,.45)"; c.beginPath(); c.ellipse(x, y + 3 + 22 * h * mode, 11 * (1 - .4 * h), 6 * (1 - .4 * h), 0, 0, 2 * PI); c.fill();
    bug(c, x, y - 22 * h * (1 - mode), a + spin * k, 1 + .15 * h, 200);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
